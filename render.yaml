# =============================================================================
# Render blueprint — VS Arogya web
#
# This repo is the FRONTEND only. It builds to static files and talks to the
# backend (swapnilintern-dev/backend_new, deployed separately) over HTTPS, so
# it is a Render Static Site rather than a web service — nothing to keep warm,
# no cold start.
#
# To use: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file; nothing has to be typed into the UI.
# =============================================================================

services:
  - type: web
    name: vs-arogya-web
    runtime: static
    # The React app lives in frontend/, not at the repo root.
    rootDir: frontend
    # `npm ci` installs exactly what package-lock.json pins, so a deploy can
    # never pick up a different dependency version than the one tested here.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Which backend the built site calls. Vite inlines this AT BUILD TIME,
      # so changing it requires a redeploy, not just a restart.
      - key: VITE_API_BASE_URL
        value: https://backend-new-0ady.onrender.com

    routes:
      # SPA fallback. React Router owns every path, but only index.html exists
      # on disk — without this, opening /admin/orders directly (or refreshing
      # it) would 404. Hashed asset files are served normally because they
      # exist; this only catches what does not.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite fingerprints everything in /assets, so those files can be cached
      # for a year: a new build produces new filenames.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must NOT be cached, or a returning visitor keeps loading the
      # previous build's asset names after a deploy.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The site is same-origin except for the API, Cloudinary media and the
      # Razorpay checkout script.
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
